{% extends "base.html" %}
{% block title %}Edit Event | Campus Event Hub{% endblock %}
{% block body %}

<div style="max-width: 580px; margin: 2rem auto;">
  <div style="background: #FFFFFF; border: 1px solid #E2DDD6; border-radius: 20px; padding: 2.5rem;">

    <!-- Header -->
    <div style="margin-bottom: 2rem;">
      <h1 style="font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: #1A1814; margin: 0 0 0.4rem;">Edit Event</h1>
      <p style="color: #7A7570; font-size: 14px; margin: 0;">Update the details for your event</p>
    </div>

    <form method="POST" action="{{ url_for('edit_event', event_id=event.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label>Event Title</label>
        <input type="text" name="title" value="{{ event.title }}" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" name="date" value="{{ event.date.strftime('%Y-%m-%dT%H:%M') }}" required>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select name="category" required>
            <option value="">Select one</option>
            <option value="Academics" {% if event.category == 'Academics' %}selected{% endif %}> Academics</option>
            <option value="Sports" {% if event.category == 'Sports' %}selected{% endif %}> Sports</option>
            <option value="Social" {% if event.category == 'Social' %}selected{% endif %}> Social</option>
            <option value="Clubs" {% if event.category == 'Clubs' %}selected{% endif %}> Clubs</option>
            <option value="Workshop" {% if event.category == 'Workshop' %}selected{% endif %}> Workshop</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Location</label>
        <input type="text" name="location" value="{{ event.location }}" required>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="4" required>{{ event.description }}</textarea>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-accent" style="flex: 1; justify-content: center; padding: 0.7rem;">Save Changes</button>
        <a href="{{ url_for('event_list') }}" class="btn btn-outline">Cancel</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
