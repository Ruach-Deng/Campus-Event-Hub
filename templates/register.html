{% extends "base.html" %}
{% block title %}Register | Campus Event Hub{% endblock %}
{% block body %}

<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 2rem 0;">
  <div style="background: #FFFFFF; border: 1px solid #E2DDD6; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px;">

    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2rem; margin-bottom: 0.75rem;">🎓</div>
      <h1 style="font-family: 'Fraunces', serif; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; color: #1A1814; margin: 0 0 0.4rem;">Create an account</h1>
      <p style="color: #7A7570; font-size: 14px; margin: 0;">Join Campus Hub and stay in the loop</p>
    </div>

    <!-- Form -->
    <form method="POST" action="{{ url_for('register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@emu.edu" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-accent" style="width: 100%; justify-content: center; padding: 0.7rem; font-size: 15px; margin-top: 0.5rem;">
        Create Account
      </button>
    </form>

    <!-- Footer -->
    <p style="text-align: center; font-size: 13px; color: #7A7570; margin-top: 1.5rem;">
      Already have an account? <a href="{{ url_for('login') }}" style="color: #C84B2F; font-weight: 500; text-decoration: none;">Sign in</a>
    </p>

  </div>
</div>

{% endblock %}
